[package]
name = "meta-signal-message"
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/meta-signal-message"
description = "Privileged Message Nexus Signal contract: configuration, the owner's Send, Redeliver."
publish = false
build = "build.rs"

[lib]
name = "meta_signal_message"
path = "src/lib.rs"

[features]
default = []
datom = ["dep:datom-codec", "dep:protos", "signal-message/datom", "signal-flow/datom", "meta-signal-flow/datom"]

[dependencies]
signal = { git = "https://github.com/LiGoldragon/signal", rev = "66e7b153706696c2cfbb2abcf931a5e83aec91af", default-features = false }
signal-message = { git = "https://github.com/LiGoldragon/signal-message", rev = "0f5c0f0db88cf353606731f7d1ae0cdf6f49cd37", default-features = false }
signal-flow = { git = "https://github.com/LiGoldragon/signal-flow", rev = "c297d987c54968659f58fa85de129504850d0234" }
meta-signal-flow = { git = "https://github.com/LiGoldragon/meta-signal-flow", rev = "69f9c146188a44979d2a870ada3b375ac04ac8b1" }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", optional = true }
protos = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }

[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "0edfc0c332e99e89263d3ec0f8538bca3fcfd44f" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
